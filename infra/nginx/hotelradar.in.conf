# HotelRADAR Direct — isolated vhost
# Proxy only to hotelradar-direct compose ports. Do not share root/assets with
# website.hotelradar.in or asavaristays.com.

server {
    listen 80;
    server_name hotelradar.in www.hotelradar.in;
    return 301 https://hotelradar.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hotelradar.in www.hotelradar.in;

    ssl_certificate     /etc/ssl/cloudflare/cf-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cf-origin.key;

    client_max_body_size 10M;

    # Direct API — compose publishes 127.0.0.1:4101
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4101/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:4101/readyz;
        proxy_set_header Host $host;
    }

    # Direct web — compose publishes 127.0.0.1:4100
    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
